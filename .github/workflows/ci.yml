name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      GOCACHE: /tmp/fireweed-rebuild-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.7'
          enable-cache: false
      - run: make check build
      - run: bin/fireweed check

  fireweed-ci:
    name: Fireweed CI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOCACHE: /tmp/fireweed-rebuild-cache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.7'
          enable-cache: false
      - run: make build
      - name: Check Fireweed project and PR history
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_AUTHOR_NAME: Fireweed Test
          GIT_AUTHOR_EMAIL: fixture@example.invalid
          GIT_COMMITTER_NAME: Fireweed Test
          GIT_COMMITTER_EMAIL: fixture@example.invalid
          LC_ALL: C
        run: bin/fireweed ci "${PR_BASE_SHA}..HEAD"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: /tmp/fireweed-rebuild-cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          install-only: true
      - run: make release-snapshot
      - run: ruby -c dist/fireweed.rb
