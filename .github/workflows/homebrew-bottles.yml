name: Homebrew bottles

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to bottle, such as v0.1.0
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: fireweed-homebrew
  cancel-in-progress: false

jobs:
  bottle:
    strategy:
      fail-fast: false
      matrix:
        # Bottles built on macOS 15 also pour on newer macOS releases.
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29
      - name: Load the released formula
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          brew tap lurkshark/tap
          mkdir release bottles
          gh release download "$RELEASE_TAG" --repo lurkshark/fireweed \
            --pattern fireweed.rb --dir release
          cp release/fireweed.rb "$(brew --repo lurkshark/tap)/Formula/fireweed.rb"
          brew trust --formula lurkshark/tap/fireweed
          brew info --json=v2 lurkshark/tap/fireweed | \
            jq -e --arg version "${RELEASE_TAG#v}" '.formulae[0].versions.stable == $version'
      - name: Prepare Intel macOS dependencies
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          # Homebrew no longer publishes new Intel macOS dependency bottles.
          # Install current runtime dependencies before bottle-build mode.
          # Let Homebrew reuse suitable build tools already on the runner.
          brew deps lurkshark/tap/fireweed > dependencies.txt
          dependencies=()
          while IFS= read -r dependency; do
            dependencies+=("$dependency")
          done < dependencies.txt
          brew install "${dependencies[@]}"
      - name: Build and test the native bottle
        shell: bash
        working-directory: bottles
        run: |
          brew install --build-bottle lurkshark/tap/fireweed
          brew test lurkshark/tap/fireweed
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/lurkshark/fireweed/releases/download/$RELEASE_TAG" \
            lurkshark/tap/fireweed
          # Exercise Homebrew's actual pour path, rather than the source installer.
          brew uninstall fireweed
          # Homebrew revokes formula-specific trust during uninstall.
          brew trust --formula lurkshark/tap/fireweed
          brew install ./fireweed--*.bottle.tar.gz
          brew info --json=v2 lurkshark/tap/fireweed | \
            jq -e '.formulae[0].installed[0].poured_from_bottle == true'
          brew test lurkshark/tap/fireweed
          test "$(fireweed version)" = "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bottles-${{ matrix.os }}
          path: bottles/*
          if-no-files-found: error

  publish:
    needs: bottle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bottles-*
          merge-multiple: true
          path: bottles
      - name: Merge bottle metadata into the released formula
        shell: bash
        run: |
          brew tap lurkshark/tap
          mkdir release
          gh release download "$RELEASE_TAG" --repo lurkshark/fireweed \
            --pattern fireweed.rb --dir release
          cp release/fireweed.rb "$(brew --repo lurkshark/tap)/Formula/fireweed.rb"
          brew trust --formula lurkshark/tap/fireweed
          test "$(find bottles -name '*.bottle.json' | wc -l | tr -d ' ')" = 4
          brew bottle --merge --write --no-commit --no-all-checks bottles/*.bottle.json
          cp "$(brew --repo lurkshark/tap)/Formula/fireweed.rb" bottles/fireweed-bottled.rb
          ruby -c bottles/fireweed-bottled.rb
          # Homebrew uses a double hyphen locally and a single hyphen in URLs.
          for metadata in bottles/*.bottle.json; do
            while IFS=$'\t' read -r local_name asset_name; do
              mv "bottles/$local_name" "bottles/$asset_name"
            done < <(jq -r '.[].bottle.tags[] | [.local_filename, .filename] | @tsv' "$metadata")
          done
      - name: Publish bottles without replacing existing release assets
        shell: bash
        run: |
          # A retried upload may find files from an earlier partial attempt.
          # Reuse identical files; never clobber a published bottle.
          mkdir existing
          for asset in bottles/*.bottle.tar.gz bottles/fireweed-bottled.rb; do
            name=$(basename "$asset")
            if gh release view "$RELEASE_TAG" --repo lurkshark/fireweed \
              --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release download "$RELEASE_TAG" --repo lurkshark/fireweed \
                --pattern "$name" --dir existing
              cmp "$asset" "existing/$name"
            else
              gh release upload "$RELEASE_TAG" "$asset" --repo lurkshark/fireweed
            fi
          done

  homebrew:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: lurkshark/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: .tap
      - name: Download the published bottled formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo lurkshark/fireweed \
            --pattern fireweed-bottled.rb
          mkdir -p .tap/Formula
          mv fireweed-bottled.rb .tap/Formula/fireweed.rb
      - name: Update Homebrew tap
        working-directory: .tap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/fireweed.rb
          if ! git diff --cached --quiet; then
            git commit -m "Bottle fireweed $RELEASE_TAG"
            git push
          fi
