name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: fireweed-release
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      GOCACHE: /tmp/fireweed-rebuild-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.7'
          enable-cache: false
      - run: make check build
      - run: bin/fireweed check
      - name: Check release version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Release tags must be stable versions such as v0.1.0.' >&2
            exit 1
          }
          test "$(bin/fireweed version)" = "${GITHUB_REF_NAME#v}"

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GOCACHE: /tmp/fireweed-rebuild-cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check Homebrew tap access
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api repos/lurkshark/homebrew-tap/branches/main --silent
      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Homebrew formula
        run: |
          python3 scripts/homebrew.py dist > dist/fireweed.rb
          ruby -c dist/fireweed.rb
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/fireweed_checksums.txt dist/fireweed.rb \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  homebrew:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/homebrew-bottles.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
