fireweed: '>=0.2, <0.3'
version: 1
remote: origin
modules:
    - packages/*
module_defaults:
    interface:
        - api.go
    evals:
        - evals/**
    disposable:
        - internal/**
hooks:
    eval: go run .fireweed/hooks.go eval {module_dir} {report}
    boundaries: go run .fireweed/hooks.go boundaries
    setup: sh .fireweed/setup.sh
drill:
    exclude:
        - docs/**
protected:
    - .github/**
    - docs/**
    - fireweed-design-v1.md
    - go.mod
    - main.go
    - Makefile
    - scripts/**
    - packages/assets/internal/content/VERSION
    - .goreleaser.yaml
    - README.md
    - LICENSE
    - .gitignore
worker_writable:
    - go.sum
agent:
    default: codex-gpt-6-2-sol-high
    commands:
        codex-gpt-6-2-sol-high:
            - codex
            - exec
            - --ephemeral
            - --ignore-user-config
            - -m
            - gpt-6.2-sol
            - -c
            - model_reasoning_effort="high"
            - -s
            - workspace-write
            - '{prompt}'
        codex-gpt-6-2-astra-medium:
            - codex
            - exec
            - --ephemeral
            - --ignore-user-config
            - -m
            - gpt-6.2-astra
            - -c
            - model_reasoning_effort="medium"
            - -s
            - workspace-write
            - '{prompt}'
        codex-gpt-6-1-sol-high:
            - codex
            - exec
            - --ephemeral
            - --ignore-user-config
            - -m
            - gpt-6.1-sol
            - -c
            - model_reasoning_effort="high"
            - -s
            - workspace-write
            - '{prompt}'
        codex-gpt-6-astra-medium:
            - codex
            - exec
            - --ephemeral
            - --ignore-user-config
            - -m
            - gpt-6-astra
            - -c
            - model_reasoning_effort="medium"
            - -s
            - workspace-write
            - '{prompt}'
        opencode-deepseek-v4-1-flash-high:
            - ./scripts/opencode
            - --standalone
            - run
            - --archived
            - --model
            - 'opencode/deepseek-v4.1-flash#high'
            - '--'
            - '{prompt}'
        opencode-inkling-2-small-high:
            - ./scripts/opencode
            - --standalone
            - run
            - --archived
            - --model
            - 'opencode/inkling-2-small-free#high'
            - '--'
            - '{prompt}'
audit:
    enabled: true
    max_rounds: 2
    agent: codex-gpt-6-2-astra-medium
authoring:
    max_unapproved: 10
attempts: 2
timeout: 90m
verify_dependents: direct
limit_patterns:
    - usage limit
    - rate limit
limit_wait: 30m
limit_budget: 4h
